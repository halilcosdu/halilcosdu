<svg xmlns="http://www.w3.org/2000/svg" width="700" height="190" viewBox="0 0 700 190" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" role="img" aria-label="halilcosdu: 664 contributions, current streak 9 days, longest streak 19 days">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14151f"/><stop offset=".55" stop-color="#1a1b26"/><stop offset="1" stop-color="#21232f"/></linearGradient>
<linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dcfff"/><stop offset=".5" stop-color="#7aa2f7"/><stop offset="1" stop-color="#bb9af7"/></linearGradient>
<clipPath id="panel"><rect width="700" height="190" rx="14"/></clipPath>
<linearGradient id="hi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bb9af7" stop-opacity=".12"/><stop offset="1" stop-color="#bb9af7" stop-opacity=".03"/></linearGradient>
<style>
.t{animation:lift .75s cubic-bezier(.2,.8,.3,1) both;transform-box:view-box}
@keyframes lift{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.hi{animation:glow 5s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.7}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.t,.hi{animation:none}.t{opacity:1;transform:none}}
</style>
</defs>
<rect width="700" height="190" rx="14" fill="url(#bg)"/>
<rect class="hi" x="239.3" y="54" width="221.3" height="122" rx="12" fill="url(#hi)" stroke="#bb9af7" stroke-opacity=".24" stroke-width="1"/>
<text x="30" y="34" font-size="15" font-weight="700" fill="url(#ttl)">Contribution streak</text>
<text x="670" y="34" text-anchor="end" font-size="11" fill="#565f7e">Aug 24, 2025 → Aug 25, 2026</text>
<g class="t" style="animation-delay:0.1s">
<text x="116.7" y="108" text-anchor="middle" font-size="36" font-weight="800" fill="#7dcfff">664</text>
<text x="116.7" y="132" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c0caf5">Total contributions</text>
<text x="116.7" y="152" text-anchor="middle" font-size="10.5" fill="#565f7e">Aug 24, 2025 → Aug 25, 2026</text>
</g>
<g class="t" style="animation-delay:0.2s">
<text x="350" y="112" text-anchor="middle" font-size="44" font-weight="800" fill="#bb9af7">9</text>
<text x="350" y="136" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c0caf5">Current streak</text>
<text x="350" y="156" text-anchor="middle" font-size="10.5" fill="#565f7e">Aug 16, 2026 → Aug 24, 2026</text>
</g>
<g class="t" style="animation-delay:0.4s">
<text x="583.3" y="108" text-anchor="middle" font-size="36" font-weight="800" fill="#7aa2f7">19</text>
<text x="583.3" y="132" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c0caf5">Longest streak</text>
<text x="583.3" y="152" text-anchor="middle" font-size="10.5" fill="#565f7e">Jul 23, 2026 → Aug 10, 2026</text>
</g>
</svg>
