name: 3D contribution wall

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"
      - "README.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render assets/contrib-3d.svg
        run: node scripts/contrib-3d.mjs
        env:
          # GITHUB_TOKEN is enough for a public contribution calendar.
          # If GitHub ever refuses it, swap in a classic PAT with read:user.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-3d.svg
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "chore: refresh 3D contribution wall"
          git push
